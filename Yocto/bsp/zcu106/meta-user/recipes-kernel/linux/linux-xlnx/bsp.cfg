# Kernel options the MIPI over Chip2Chip design depends on.
#
# Sections 1 to 4 are ALREADY set this way by the EDF 2025.2 ZynqMP kernel
# (linux-xlnx 6.12.40, checked in the .config of a finished EDF build); they are
# restated so that the design keeps working if a later EDF release trims its
# defconfig. Only section 5 changes the stock configuration.
#
# All the drivers are built in (=y), not modules: they probe as soon as their
# device-tree node appears, which for the remote peripherals is the moment the
# overlay is applied (see c2c-overlay).

# 1. V4L2 / media controller core and the AMD video pipeline drivers.
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_PLATFORM_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_VIDEO_XILINX=y
CONFIG_VIDEO_XILINX_CSI2RXSS=y
CONFIG_VIDEO_XILINX_DEMOSAIC=y
CONFIG_VIDEO_XILINX_GAMMA=y
CONFIG_VIDEO_XILINX_VPSS_SCALER=y
CONFIG_VIDEO_XILINX_VPSS_CSC=y
CONFIG_XILINX_FRMBUF=y

# 2. Sensor (Raspberry Pi Camera v2) and the AXI peripherals of each pipeline:
#    AXI IIC (sensor control), AXI GPIO (resets, camera enable, link status),
#    AXI INTC (the cascaded interrupt controller of the AUBoard).
CONFIG_VIDEO_CAMERA_SENSOR=y
CONFIG_VIDEO_IMX219=y
CONFIG_I2C_XILINX=y
CONFIG_I2C_CHARDEV=y
CONFIG_GPIO_XILINX=y
CONFIG_GPIO_CDEV=y
CONFIG_XILINX_INTC=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y

# 3. Run-time device-tree overlays through configfs
#    (/sys/kernel/config/device-tree/overlays): the nodes of the remote
#    peripherals are applied after the Chip2Chip link is up.
CONFIG_OF_OVERLAY=y
CONFIG_CONFIGFS_FS=y
CONFIG_OF_CONFIGFS=y

# 4. /dev/mem access to the PL (devmem2 on the link status GPIO and on the
#    Chip2Chip window), and the board Ethernet (GEM3 + TI DP83867) with the
#    packet generator the bench tooling uses.
CONFIG_DEVMEM=y
# CONFIG_STRICT_DEVMEM is not set
CONFIG_MACB=y
CONFIG_DP83867_PHY=y
CONFIG_NET_PKTGEN=y

# 5. Changes to the stock configuration.
#    CMA: default area of 1 GB for the capture buffers of two 1080p pipelines
#    (stock: 256). The cma= option of /chosen/bootargs (system-user.dtsi) takes
#    precedence when present; this is the fallback.
CONFIG_CMA=y
CONFIG_DMA_CMA=y
CONFIG_CMA_SIZE_MBYTES=1024
#    Dynamic debug (stock: off): switch on the dev_dbg() output of the built-in
#    video drivers at run time, without a kernel rebuild, e.g.
#    echo 'file xilinx-csi2rxss.c +p' > /sys/kernel/debug/dynamic_debug/control
CONFIG_DYNAMIC_DEBUG=y

# 6. DisplayPort output of the two camera streams (docs/source/display.md).
#    Like sections 1 to 4 these are ALREADY set by the EDF 2025.2 ZynqMP kernel;
#    they are restated because the display path silently stops working if any one
#    of them is dropped. The mixer is built in, so its connect_drm_bridge
#    parameter can only be passed on the kernel command line (system-user.dtsi).
#    DRM_XLNX_MIXER      the PL video mixer: one CRTC + one plane per layer
#    DRM_XLNX_BRIDGE_VTC the timing controller the mixer drives as an xlnx bridge
#    DRM_ZYNQMP_DPSUB    the PS DisplayPort; in live-video mode it registers only
#                        a drm_bridge, so the single DRM card is the mixer's "xlnx"
#    DRM_BRIDGE_CONNECTOR / DRM_DISPLAY_CONNECTOR  the connector the mixer builds
#                        from that bridge (without them modetest sees 0 connectors)
#    COMMON_CLK_XLNX_CLKWZRD  lets the dpsub retune the PL pixel-clock wizard to
#                        the mode's pixel clock (the wizard is built with dynamic
#                        reconfiguration)
#    PHY_XILINX_ZYNQMP   the PS-GTR lanes that carry the DP link
CONFIG_DRM=y
CONFIG_DRM_XLNX=y
CONFIG_DRM_XLNX_MIXER=y
CONFIG_DRM_XLNX_BRIDGE=y
CONFIG_DRM_XLNX_BRIDGE_VTC=y
CONFIG_DRM_ZYNQMP_DPSUB=y
CONFIG_DRM_BRIDGE_CONNECTOR=y
CONFIG_DRM_DISPLAY_CONNECTOR=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_COMMON_CLK_XLNX_CLKWZRD=y
CONFIG_PHY_XILINX_ZYNQMP=y
